[package]
name = "webrender_api"
version = "0.66.0"
authors = ["Glenn Watson <gw@intuitionlibrary.com>"]
license = "MPL-2.0"
repository = "https://github.com/servo/webrender"
description = "Public API for WebRender"
edition = "2018"

[features]
nightly = ["euclid/unstable", "serde/unstable"]
serialize = []
deserialize = []
display_list_stats = []
fontations = []

[dependencies]
app_units = "0.7.3"
bitflags = { version = "2", features = ["serde"] }
byteorder = "1.2.1"
euclid = { version = "0.22.6", features = ["serde"] }
malloc_size_of_derive = "0.1"
serde = { version = "1.0", features = ["rc"] }
serde_derive = "1.0"
serde_bytes = "0.11"
malloc_size_of = { version = "0.2.0", path = "../wr_malloc_size_of", package = "wr_malloc_size_of" }
peek-poke = { version = "0.3", path = "../peek-poke", features = ["extras"] }
crossbeam-channel = "0.5"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
mach2 = { version = "0.4" }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
libc = { version = "0.2" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Performance"] }

