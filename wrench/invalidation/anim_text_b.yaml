# Frame b: property 10 has moved to a new value, so the bound reference frame is
# now latched as animating and the text is rasterized in local space. See
# anim_text_a.yaml (before the move) and anim_text_c.yaml (the animation ends).
---
transform-properties:
  - id: 10
    transform: translate(0, 0)
root:
  items:
    - type: reference-frame
      bounds: [0, 0, 500, 200]
      transform: translate(0, 0)
      transform-binding: 10
      items:
        - type: text
          origin: [20, 100]
          text: "Animated text"
          font: "../reftests/text/FreeSans.ttf"
          size: 40
          color: [255, 255, 255, 1]
