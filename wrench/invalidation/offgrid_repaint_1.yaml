# Frame 1 of the off-grid repaint pair, a variant of eso_repaint_1/2 whose green
# rect has an x coordinate that is not a whole app unit on the grid the display
# list declares (10.3456789 * 60 = 620.74 au). Frame 1 carries the whole 60px
# scroll as an async delta (external-scroll-offset zero), frame 2 as
# external-scroll-offset.
#
# The x coordinate is identical in both frames and the scroll offset is y-only,
# so x must come through untouched in both. Rounding it onto the app-unit grid in
# frame 2 only (which is what a per-point rather than per-axis `AuGrid::add`
# early-out does) leaves a difference the quantized raster corners cannot see but
# a bit-exact interning key compare can, dirtying the tile. See bug 2059620.

root:
  items:
    - type: scroll-frame
      id: 2
      bounds: [0, 0, 200, 200]
      content-size: [200, 400]
      external-scroll-offset: [0, 0]
      scroll-offset: [0, 60]
      clip-to-frame: true
      items:
        # A clip defined inside the scroll frame, so it is subject to the same
        # normalization as the primitives (unlike the clip-to-frame clip above,
        # which lives in the parent space).
        - type: clip
          id: 3
          bounds: [0, 0, 200, 400]
        - type: rect
          bounds: [0, 0, 200, 400]
          color: white
          clip-chain: [2, 3]
        - type: rect
          bounds: [10.3456789, 100, 50, 40]
          color: green
          clip-chain: [2, 3]
        - type: text
          origin: [10, 180]
          text: "Scrolled text"
          font: "../reftests/text/FreeSans.ttf"
          size: 20
          color: [0, 0, 0, 1]
          clip-chain: [2, 3]
