root:
  items:
    - type: rect
      color: white
      bounds: [0, 0, 400, 400]
    - type: iframe
      id: [1, 3]
      bounds: [0, 0, 400, 400]
    - type: backdrop-filter
      bounds: [0, 0, 400, 80]
      filters: blur(8,8)
    - type: rect
      color: 255 255 255 0.4
      bounds: [0, 0, 400, 80]

pipelines:
  -
    id: [1, 3]
    items:
      - type: rect
        color: 128 128 128
        bounds: [0, 0, 400, 400]
      - image: transparent-checkerboard(2,16,16)
        bounds: [50, 20, 300, 120]
        prefer-compositor-surface: true
