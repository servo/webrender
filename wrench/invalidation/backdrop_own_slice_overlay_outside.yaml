# An image that can be promoted to an overlay, in the backdrop-filter's slice
# but outside the area it samples.
root:
  items:
    - type: rect
      color: 128 128 128
      bounds: [0, 0, 400, 400]
    - image: transparent-checkerboard(2,16,16)
      bounds: [50, 200, 300, 120]
      prefer-compositor-surface: true
    - type: backdrop-filter
      bounds: [0, 0, 400, 80]
      filters: blur(8,8)
    - type: rect
      color: 255 255 255 0.4
      bounds: [0, 0, 400, 80]
