# A single radius on two corners and zero on the others. Native compositors can
# apply this, so it is promoted to a compositor clip. The asymmetric corners
# check each one is lowered to the right slot of the compositor clip.
---
root:
  items:
    - type: clip
      id: 2
      complex:
        - rect: [100, 100, 500, 400]
          radius: [0, 40, 40, 0]
    - type: stacking-context
      clip-chain: [2]
      items:
        - type: rect
          bounds: [50, 50, 600, 500]
          color: green
