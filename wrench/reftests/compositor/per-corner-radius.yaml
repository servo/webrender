# Four different circular corner radii. Native compositors such as CoreAnimation
# can only apply a single radius, so this must not be promoted to a compositor
# clip and falls back to the per-primitive clip path (bug 2079096).
---
root:
  items:
    - type: clip
      id: 2
      complex:
        - rect: [100, 100, 500, 400]
          radius: [10, 40, 80, 120]
    - type: stacking-context
      clip-chain: [2]
      items:
        - type: rect
          bounds: [50, 50, 600, 500]
          color: green
