# Two concentric rounded clips in the same chain. Intersecting them would give
# different radii on the top and bottom corners, which native compositors can't
# apply, so only one of them is promoted to a compositor clip and the other is
# applied per primitive. Pixel counterpart of test_rounded_rect_intersection in
# wrench/src/test_invalidation.rs.
---
root:
  items:
    - type: clip
      id: 2
      complex:
        - rect: [100, 100, 600, 500]
          radius: 40
    - type: clip
      id: 3
      complex:
        - rect: [100, 100, 600, 420]
          radius: 25
    - type: stacking-context
      clip-chain: [2, 3]
      items:
        - type: rect
          bounds: [50, 50, 700, 600]
          color: green
