# A backdrop-filter over a slice below its own, with every tile of its own
# slice occluded by an opaque slice above, draws nothing, and must not leave
# the parts of the lower slice it would sample unused.
root:
  items:
    - type: rect
      color: white
      bounds: [0, 0, 400, 400]
    - type: scroll-frame
      bounds: [0, 0, 400, 400]
      content-size: [400, 1200]
      scroll-offset: [0, 53]
      items:
        - type: rect
          color: green
          bounds: [20, 100, 200, 200]
    - type: backdrop-filter
      bounds: [100, 150, 200, 100]
      filters: invert(1)
    - type: scroll-frame
      bounds: [0, 0, 400, 400]
      content-size: [400, 1000]
      items:
        - type: rect
          color: blue
          bounds: [0, 0, 400, 400]
