# A backdrop-filter under an invisible picture, over a slice below its own,
# draws nothing, and must not leave the parts of the lower slice it would
# sample unused.
root:
  items:
    - type: rect
      color: white
      bounds: [0, 0, 400, 400]
    - type: scroll-frame
      bounds: [0, 0, 400, 400]
      content-size: [400, 1200]
      scroll-offset: [0, 53]
      items:
        - type: rect
          color: green
          bounds: [20, 100, 200, 200]
    - type: stacking-context
      bounds: [100, 150, 0, 0]
      filters: [opacity(0)]
      wraps-backdrop-filter: true
      items:
        - type: backdrop-filter
          bounds: [0, 0, 200, 100]
          filters: invert(1)
