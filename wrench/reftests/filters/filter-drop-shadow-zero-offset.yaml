# A drop shadow with no offset and no blur shows beneath translucent content.
---
root:
  items:
    - type: stacking-context
      bounds: [100, 100, 100, 100]
      filters: drop-shadow([0, 0], 0, red)
      items:
        - type: rect
          bounds: [0, 0, 100, 100]
          color: [0, 0, 0, 0.4]
