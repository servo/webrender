# A static scene rendered repeatedly. Once the picture cache tiles have
# settled, each frame produces byte-identical prim headers, transform palette
# and render task data, so the vertex data textures must not be re-uploaded.
# Creating a texture uploader probes the upload PBO pool's fences, which
# flushes the GPU command stream on some drivers.
---
root:
  items:
    -
      type: rect
      bounds: [10, 10, 100, 100]
      color: [0, 128, 255, 1]
    -
      type: rect
      bounds: [40, 40, 100, 100]
      color: [255, 128, 0, 1]
