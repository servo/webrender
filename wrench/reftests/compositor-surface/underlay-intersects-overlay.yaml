# A masked YUV image that overlaps an already promoted overlay cannot become an
# underlay, because the cutout cannot punch through the overlay. It falls back
# to being drawn as a regular primitive.
# Reference image is public-domain - https://en.wikipedia.org/wiki/File:Barn-yuv.png
---
root:
  items:
    - type: rect
      bounds: [0, 0, 500, 500]
      color: white
    - type: yuv-image
      format: planar
      src-y: barn-y.png
      src-u: barn-u.png
      src-v: barn-v.png
      bounds: [100, 100, 299, 299]
      prefer-compositor-surface: true
    - type: clip
      id: 3
      complex:
        - rect: [150, 150, 199, 199]
          radius: 32
    - type: yuv-image
      format: planar
      src-y: barn-y.png
      src-u: barn-u.png
      src-v: barn-v.png
      bounds: [150, 150, 199, 199]
      prefer-compositor-surface: true
      clip-chain: [3]
