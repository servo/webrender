# A pipeline may embed the pipelines of the namespaces in its embed policy.
---
enforce-embed-policy: true
root:
  embed-policy: unrestricted
  items:
    -
      bounds: [0, 0, 200, 200]
      type: iframe
      id: [1, 2]
pipelines:
  -
    id: [1, 2]
    embed-policy: [5, 3]
    items:
      -
        bounds: [0, 0, 50, 50]
        color: green
        type: rect
      -
        bounds: [100, 0, 100, 100]
        type: iframe
        id: [3, 7]
  -
    id: [3, 7]
    items:
      -
        bounds: [0, 0, 50, 50]
        color: blue
        type: rect
