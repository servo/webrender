# Regression test: a mix-blend-mode picture whose transform cannot map its
# content into the parent surface must not panic (bug 2058972). The visible
# rect is there to keep the reftest non-blank.
---
root:
  items:
    - type: stacking-context
      mix-blend-mode: hue
      transform: [
        0, -866, -1, 0,
        -321536, -2512, -1, -628,
        444417, 3472.46, 0, 868,
        1286313, 453441.3, 524, 2512.33
      ]
      items:
        - type: rect
          bounds: [0, 0, 1024, 8]
          color: black
    - type: rect
      bounds: [0, 0, 100, 100]
      color: red
