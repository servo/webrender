---
root:
  items:
    - type: stacking-context
      blend-container: true
      bounds: [0, 0, 100, 100]
      items:
        - type: rect
          bounds: [0, 0, 100, 100]
          color: [128, 128, 128]
        - type: stacking-context
          bounds: [0, 0, 100, 100]
          mix-blend-mode: color-dodge
          items:
            # feComposite arithmetic works on premultiplied colors and clamps
            # each channel independently, so subtracting alpha from an opaque
            # white produces a color that is above 1.0 once un-premultiplied.
            # color-dodge with a white source is white regardless.
            - type: stacking-context
              bounds: [0, 0, 100, 100]
              filters:
                - svgfe: SourceGraphic
                  linear: false
                  subregion: [0, 0, 100, 100]
                - svgfe: flood
                  linear: false
                  subregion: [0, 0, 100, 100]
                  color: [0, 0, 0, 0.5]
                - svgfe: compositearithmetic
                  linear: false
                  subregion: [0, 0, 100, 100]
                  in: 0
                  in2: 1
                  k: [0, 1, -1, 0]
              items:
                - type: rect
                  bounds: [0, 0, 100, 100]
                  color: [255, 255, 255]
