# Same scaled-up image without the perspective surface, so it is rasterized directly.
---
root:
  items:
    - type: "stacking-context"
      transform-origin: 0 0
      transform: scale(40)
      items:
        - image: checkerboard(0, 1, 1, 8, 8)
          bounds: [0, 0, 8, 8]
          rendering: pixelated
