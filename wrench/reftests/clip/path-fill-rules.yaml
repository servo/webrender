# Axis-aligned path clips: even-odd and nonzero fill rules, a reversed sub-path,
# an open sub-path, a path extending past its rect and overlapping sub-paths.
---
root:
  items:
    - type: clip
      id: 1
      path:
        rect: [20, 20, 100, 100]
        data: "M 0 0 L 100 0 L 100 100 L 0 100 Z M 25 25 L 75 25 L 75 75 L 25 75 Z"
        fill-rule: evenodd
    - type: clip-chain
      id: 101
      clips: [1]
    - type: rect
      bounds: [20, 20, 100, 100]
      color: green
      clip-chain: 101
    - type: clip
      id: 2
      path:
        rect: [140, 20, 100, 100]
        data: "M 0 0 L 100 0 L 100 100 L 0 100 Z M 25 25 L 75 25 L 75 75 L 25 75 Z"
        fill-rule: nonzero
    - type: clip-chain
      id: 102
      clips: [2]
    - type: rect
      bounds: [140, 20, 100, 100]
      color: green
      clip-chain: 102
    - type: clip
      id: 3
      path:
        rect: [260, 20, 100, 100]
        data: "M 0 0 L 100 0 L 100 100 L 0 100 Z M 25 25 L 25 75 L 75 75 L 75 25 Z"
        fill-rule: nonzero
    - type: clip-chain
      id: 103
      clips: [3]
    - type: rect
      bounds: [260, 20, 100, 100]
      color: green
      clip-chain: 103
    - type: clip
      id: 4
      path:
        rect: [380, 20, 100, 100]
