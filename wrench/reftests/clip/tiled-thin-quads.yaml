# Wide and short quads that need a mask and take the tiled rendering strategy.
# Two nested rounded clips are needed: a single rounded clip would be handled by
# the nine-patch strategy instead. The stack of one pixel tall quads must render
# the same as the single quad covering them in the reference.
---
root:
  items:
    - type: rect
      bounds: [0, 0, 640, 80]
      color: white
    -
      type: clip
      id: 2
      clip-rect: [20, 20, 600, 40]
      complex:
        - rect: [20, 20, 600, 40]
          radius: [20, 20]
          "clip-mode": clip
    - type: clip-chain
      id: 12
      clips: [2]
    -
      type: clip
      id: 3
      clip-rect: [20, 20, 600, 40]
      complex:
        - rect: [20, 20, 600, 40]
          radius: [14, 14]
          "clip-mode": clip
    - type: clip-chain
      id: 13
      clips: [3]
      parent: 12
    - type: rect
      bounds: [20, 20, 600, 1]
      color: [0, 0, 128, 1]
      clip-chain: 13
