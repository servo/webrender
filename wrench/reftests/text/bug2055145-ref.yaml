# Reference for bug 2055145: the same Ahem block, clipped at an integer edge (45)
# that keeps its bottom row [44,45). The test (clip 44.3) should render identically
# once a device-space text run's clip rounds out on the non-sub-pixel axis.
root:
  items:
    - type: rect
      bounds: [0, 0, 200, 200]
      color: white
    - bounds: [0, 0, 80, 80]
      glyphs: [55]
      offsets: [10, 40]
      clip-rect: [0, 0, 60, 45]
      size: 20
      color: [0, 0, 0, 1]
      font: "Ahem.ttf"
