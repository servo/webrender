# Reference for bug 2055555: the same scrolled bands, with the region the
# backdrop-filter covers drawn as explicit inverted-colour rects (no
# backdrop-filter, so it does not depend on the resolve/readback path).
---
root:
  items:
    - type: scroll-frame
      bounds: 0 0 400 400
      content-size: 400 800
      scroll-offset: 0 200
      items:
        - type: stacking-context
          backdrop-root: true
          bounds: 0 0 400 800
          items:
            - type: rect
              bounds: 0 0 400 40
              color: [230, 30, 30, 1]
            - type: rect
              bounds: 0 40 400 40
              color: [30, 200, 30, 1]
