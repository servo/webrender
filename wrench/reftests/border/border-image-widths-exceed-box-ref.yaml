---
# Same nine-patch border, with an explicit clip rect equal to its own box.
# Equivalent to the test only if the segments are bounded by the box.
root:
  items:
    - type: rect
      bounds: [0, 0, 200, 200]
      color: white
    - type: border
      bounds: [90, 90, 20, 20]
      clip-rect: [90, 90, 20, 20]
      width: 100
      border-type: image
      image-source: "border-image-src.png"
      image-width: 96
      image-height: 96
      slice: [ 32, 32, 32, 32 ]
      repeat-vertical: stretch
      repeat-horizontal: stretch
