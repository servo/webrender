[workspace]
members = [
    "examples",
    "webrender",
    "webrender_api",
]
resolver = "2"

[workspace.package]
version = "0.71.0"

[workspace.dependencies]
gleam = "0.16"
glean = "=71.0.0"

api = { version = "0.71", path = "./webrender_api", package = "webrender_api" }
glsl-to-cxx = { version = "0.71", path = "./glsl-to-cxx", package = "glsl-to-cxx" }
glyph_rasterizer = { version = "0.71", path = "./wr_glyph_rasterizer", package = "wr_glyph_rasterizer", default-features = false }
malloc_size_of = { version = "0.2.2", path = "./wr_malloc_size_of", package = "wr_malloc_size_of" }
peek-poke = { version = "0.3", path = "./peek-poke", package = "peek-poke" }
swgl = { version = "0.71", path = "./swgl", package = "swgl" }
webrender = { version = "0.71", path = "./webrender", package = "webrender" }
webrender_build = { version = "0.71", path = "./webrender_build", package = "webrender_build" }

[profile.release]
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

# optimizing glsl more makes a big difference in swgl build times
[profile.dev.package.glsl]
opt-level = 2

[profile.release.package.glsl]
opt-level = 2

[patch.crates-io]
firefox-on-glean = { path = "fog" }
# gl_generator 0.14.0 + https://github.com/rust-windowing/gl-rs/pull/566
gl_generator = { git = "https://github.com/jamienicol/gl-rs", rev = "71c792dbfe0ec5caeb242fc90937e19098386342" }
wr_malloc_size_of = { path = "wr_malloc_size_of" }
